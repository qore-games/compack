name: Desktop app

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Native app — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos
            runner: macos-14
            goos: darwin
            goarch: arm64
            binary: compack
          - target: linux
            os: linux
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: compack
          - target: windows
            os: windows
            runner: windows-latest
            goos: windows
            goarch: amd64
            binary: compack.exe
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Native SDK CLI
        run: npm install -g @native-sdk/cli@0.6.0

      - name: Install GTK development headers (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libglib2.0-dev libsoup-3.0-dev libxml2-dev

      - name: Build compack binary
        shell: bash
        working-directory: .
        run: |
          mkdir -p app/assets
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o app/assets/${{ matrix.binary }} .
          chmod +x app/assets/${{ matrix.binary }}

      - name: Check the app
        run: native check

      - name: Build the app
        run: native build

      - name: Package the app
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            # Windows: skip native package (has StreamTooLong issue), use PowerShell to zip
            mkdir -p compack-desktop
            cp zig-out/bin/compack.exe compack-desktop/
            cp assets/compack.exe compack-desktop/ 2>/dev/null || true
            cp assets/icon.png compack-desktop/ 2>/dev/null || true
            powershell -Command "Compress-Archive -Path compack-desktop -DestinationPath compack-desktop-windows.zip -Force"
          else
            native package --target ${{ matrix.target }} --output ../compack-desktop --archive
          fi

      - name: Locate the archive
        id: archive
        shell: bash
        working-directory: .
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            # Windows: use the manually created zip
            echo "path=app/compack-desktop-windows.zip" >> "$GITHUB_OUTPUT"
            echo "name=compack-desktop-windows.zip" >> "$GITHUB_OUTPUT"
          else
            # macOS/Linux: find the archive created by native package --archive and rename it
            f=$(ls compack-*ReleaseFast.tar.gz compack-*ReleaseFast.zip compack-*ReleaseFast.dmg 2>/dev/null | head -1 || true)
            if [ -z "$f" ]; then f=$(ls app-*ReleaseFast.tar.gz app-*ReleaseFast.zip app-*ReleaseFast.dmg 2>/dev/null | head -1 || true); fi
            if [ -z "$f" ]; then echo "no archive found"; find . -name 'compack-*ReleaseFast.*' | head; exit 1; fi
            # Rename to include desktop suffix
            newname=$(echo "$f" | sed 's/ReleaseFast//')
            mv "$f" "$newname"
            echo "path=$newname" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$newname")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: compack-desktop-${{ matrix.target }}-archive
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error

  appimage:
    name: AppImage — linux
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Native SDK CLI
        run: npm install -g @native-sdk/cli@0.6.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libglib2.0-dev libsoup-3.0-dev libxml2-dev

      - name: Build compack binary
        run: |
          mkdir -p app/assets
          GOOS=linux GOARCH=amd64 go build -o app/assets/compack .
          chmod +x app/assets/compack

      - name: Build the app
        working-directory: app
        run: native build

      - name: Create AppImage
        working-directory: app
        run: |
          # Download appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.appimage
          chmod +x appimagetool-x86_64.appimage

          # Create AppDir structure manually
          rm -rf compack.AppDir
          mkdir -p compack.AppDir/usr/bin
          mkdir -p compack.AppDir/usr/share/applications
          mkdir -p compack.AppDir/usr/share/icons/hicolor/512x512/apps

          # Copy the built binary
          cp zig-out/bin/compack compack.AppDir/usr/bin/
          chmod +x compack.AppDir/usr/bin/compack

          # Copy the compack CLI binary into the AppImage
          cp assets/compack compack.AppDir/usr/bin/compack-cli
          chmod +x compack.AppDir/usr/bin/compack-cli

          # Create desktop file
          cat > compack.AppDir/compack.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Compack
          Comment=A fast Minecraft resource/data pack optimizer
          Exec=compack
          Icon=app-icon
          Categories=Game;Utility;
          EOF

          # Copy icon to root of AppDir
          cp assets/icon.png compack.AppDir/app-icon.png 2>/dev/null || true

          # Create AppRun
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/compack" "$@"\n' > compack.AppDir/AppRun
          chmod +x compack.AppDir/AppRun

          # Build the AppImage
          ./appimagetool-x86_64.appimage compack.AppDir compack-desktop-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: compack-desktop-appimage
          path: app/compack-desktop-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [build, appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/compack-*
          generate_release_notes: true